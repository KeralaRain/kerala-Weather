name: Daily KSEB SLDC Telemetry Sync

on:
  schedule:
    - cron: '0 4 * * *'   # Runs daily at 04:00 UTC (09:30 AM IST)
  workflow_dispatch:        # Allows manual 1-click "Run workflow" test

jobs:
  sync-kseb:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas sqlalchemy xlrd openpyxl

      - name: Configure temporary IMAP credentials from GitHub Secrets
        env:
          KSEB_USER: ${{ secrets.KSEB_EMAIL_USER }}
          KSEB_PASS: ${{ secrets.KSEB_EMAIL_PASS }}
        run: |
          mkdir -p ~/kseb_telemetry_worker/downloads
          cat << 'ENVEOF' > ~/.kseb_mail.env
          KSEB_IMAP_HOST=webmail.kseb.in
          KSEB_IMAP_PORT=993
          KSEB_EMAIL_USER=${KSEB_USER}
          KSEB_EMAIL_PASS=${KSEB_PASS}
          ENVEOF
          chmod 600 ~/.kseb_mail.env

      - name: Run incremental non-rewriting KSEB harvester
        run: python kseb_harvester.py

      - name: Commit and push updated kseb_sldc_telemetry.db if new dates imported
        run: |
          rm -f ~/.kseb_mail.env
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kseb_sldc_telemetry.db
          git diff --staged --quiet || (git commit -m "Auto-sync KSEB SLDC telemetry $(date -u +%Y-%m-%d)" && git push)
